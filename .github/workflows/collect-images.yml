name: Collect local website photography

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate licensed-source photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?fit=crop&w=1800&q=82&fm=jpg' -o assets/images/contract-documents.jpg
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1560520653-9e0e4c89eb11?fit=crop&w=1200&q=80&fm=jpg' -o assets/images/property-buildings.jpg
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1521737711867-e3b97375f902?fit=crop&w=1200&q=80&fm=jpg' -o assets/images/work-team.jpg
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?fit=crop&w=1200&q=80&fm=jpg' -o assets/images/business-documents.jpg
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?fit=crop&w=1200&q=80&fm=jpg' -o assets/images/technology-office.jpg
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?fit=crop&w=1200&q=80&fm=jpg' -o assets/images/vehicle.jpg
          curl -fLsS --retry 3 'https://images.unsplash.com/photo-1460925895917-afdcc4643fbf?fit=crop&w=1200&q=80&fm=jpg' -o assets/images/finance-dashboard.jpg
          for image in assets/images/contract-documents.jpg assets/images/property-buildings.jpg assets/images/work-team.jpg assets/images/business-documents.jpg assets/images/technology-office.jpg assets/images/vehicle.jpg assets/images/finance-dashboard.jpg; do
            test -s "$image"
            mime="$(file --brief --mime-type "$image")"
            case "$mime" in image/jpeg|image/webp|image/png) ;; *) echo "Unexpected image MIME type: $mime for $image"; exit 1;; esac
          done
      - name: Commit local image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/*.jpg
          if git diff --cached --quiet; then
            echo 'Image assets are already up to date.'
            exit 0
          fi
          git commit -m 'Add locally stored website photography'
          git push