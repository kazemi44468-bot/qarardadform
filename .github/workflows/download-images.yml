name: Download local contract-form images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image files
        run: |
          mkdir -p assets/images
          curl -fLsS 'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?fit=crop&w=1800&q=80&fm=jpg' -o assets/images/contract-documents.jpg
          curl -fLsS 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?fit=crop&w=1200&q=78&fm=jpg' -o assets/images/property-buildings.jpg
          curl -fLsS 'https://images.unsplash.com/photo-1521737711867-e3b97375f902?fit=crop&w=1200&q=78&fm=jpg' -o assets/images/work-team.jpg
          curl -fLsS 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?fit=crop&w=1200&q=78&fm=jpg' -o assets/images/business-documents.jpg
          curl -fLsS 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?fit=crop&w=1200&q=78&fm=jpg' -o assets/images/technology-office.jpg
          curl -fLsS 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?fit=crop&w=1200&q=78&fm=jpg' -o assets/images/vehicle.jpg
          curl -fLsS 'https://images.unsplash.com/photo-1460925895917-afdcc4643fbf?fit=crop&w=1200&q=78&fm=jpg' -o assets/images/finance-dashboard.jpg
          file assets/images/*.jpg
      - name: Save image files in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add locally stored website photography'
          git push