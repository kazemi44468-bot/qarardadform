name: Collect local photography (validated)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download available image sources with fallback
        shell: bash
        run: |
          mkdir -p assets/images
          fetch_image() {
            name="$1"; shift
            for url in "$@"; do
              echo "Trying $name from $url"
              if curl -fLsS --retry 1 "$url" -o "assets/images/$name"; then
                if test -s "assets/images/$name" && file --brief --mime-type "assets/images/$name" | grep -q '^image/'; then
                  echo "Saved $name"
                  return 0
                fi
              fi
            done
            rm -f "assets/images/$name"
            echo "No working source for $name; continuing."
          }
          fetch_image contract-documents.jpg             'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?fit=crop&w=1800&q=80&fm=jpg'             'https://images.unsplash.com/photo-1505664194779-8beaceb93744?fit=crop&w=1800&q=80&fm=jpg'
          fetch_image property-buildings.jpg             'https://images.unsplash.com/photo-1560518883-ce09059eeffa?fit=crop&w=1200&q=78&fm=jpg'             'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?fit=crop&w=1200&q=78&fm=jpg'
          fetch_image work-team.jpg             'https://images.unsplash.com/photo-1521737711867-e3b97375f902?fit=crop&w=1200&q=78&fm=jpg'             'https://images.unsplash.com/photo-1522071820081-009f0129c71c?fit=crop&w=1200&q=78&fm=jpg'
          fetch_image business-documents.jpg             'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?fit=crop&w=1200&q=78&fm=jpg'             'https://images.unsplash.com/photo-1497366811353-6870744d04b2?fit=crop&w=1200&q=78&fm=jpg'
          fetch_image technology-office.jpg             'https://images.unsplash.com/photo-1497366754035-f200968a6e72?fit=crop&w=1200&q=78&fm=jpg'             'https://images.unsplash.com/photo-1497366216548-37526070297c?fit=crop&w=1200&q=78&fm=jpg'
          fetch_image vehicle.jpg             'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?fit=crop&w=1200&q=78&fm=jpg'             'https://images.unsplash.com/photo-1503376780353-7e6692767b70?fit=crop&w=1200&q=78&fm=jpg'
          fetch_image finance-dashboard.jpg             'https://images.unsplash.com/photo-1460925895917-afdcc4643fbf?fit=crop&w=1200&q=78&fm=jpg'             'https://images.unsplash.com/photo-1554224155-6726b3ff858f?fit=crop&w=1200&q=78&fm=jpg'
          test "$(find assets/images -maxdepth 1 -name '*.jpg' -type f | wc -l)" -ge 4
      - name: Commit local image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/*.jpg
          if git diff --cached --quiet; then echo 'No new images to commit.'; exit 0; fi
          git commit -m 'Add locally stored website photography'
          git push